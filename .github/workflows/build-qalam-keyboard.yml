name: Build Qalam Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check for Qalam project archive
        run: |
          test -f QalamKeyboard-Android-Project-v0.2.0.zip || {
            echo "::error::Missing QalamKeyboard-Android-Project-v0.2.0.zip at repository root."
            exit 1
          }

      - name: Extract project
        run: unzip QalamKeyboard-Android-Project-v0.2.0.zip -d source

      - name: Build debug APK
        run: gradle -p source assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QalamKeyboard-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
