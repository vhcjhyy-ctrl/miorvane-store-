services:
  job-agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      AI_COVER_LETTER_ENABLED: ${AI_COVER_LETTER_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "127.0.0.1:${JOB_AGENT_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
